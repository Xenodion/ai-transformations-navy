  <g id="text_29">
   <text style="font-size: 9.5px; font-family: 'Segoe UI', 'Arial', 'DejaVu Sans'; fill: #5b6673" transform="translate(20.16 412.774969)">Nagji &amp; Tuff (HBR 2012) framework: Capital commitment targets 70/20/10 baseline (Course Session 2). Our portfolio allocates 64.9% H0+H1 / 19.1% H2 / 16.0% H3.</text>
   <text style="font-size: 9.5px; font-family: 'Segoe UI', 'Arial', 'DejaVu Sans'; fill: #5b6673" transform="translate(20.16 424.00575)">Middle bar reflects near-term 5-year NPV (+$612.3M) where H1/H2 generate 81.8% of cash to self-fund the J-curve without framework target lines.</text>
   <text style="font-size: 9.5px; font-family: 'Segoe UI', 'Arial', 'DejaVu Sans'; fill: #5b6673" transform="translate(20.16 435.236531)">Bottom bar demonstrates the 70-20-10 strategic value inversion at commercial maturity (2030+) where H3 reaches 61.8% (~62-70%, $330M/yr) through VPP flexibility and e-SAF discovery.</text>
  </g>
