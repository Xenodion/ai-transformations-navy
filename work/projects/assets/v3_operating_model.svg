    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #e30613" transform="translate(7.2 343.494259)">Each actor answers to a different manager and objective.</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'; fill: #e30613" transform="translate(7.2 354.132181)">Progress reviews are spaced out; feedback loops are slow;</text>
